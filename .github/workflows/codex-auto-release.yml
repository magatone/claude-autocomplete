name: Codex Auto releases
on:
  # Enable hourly scheduling after native preview and first-release validation.
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact stable Codex version, empty for pending versions'
        type: string
        default: ''
      retry_failed:
        description: 'Retry builds previously recorded as failed'
        type: boolean
        default: false
      publish:
        description: 'Publish verified builds (false runs a preview)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: codex-auto-discovery
  cancel-in-progress: false
jobs:
  discover:
    if: github.repository == 'magatone/claude-autocomplete'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has_work: ${{ steps.discover.outputs.has_work }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check release policy
        shell: pwsh
        run: |
          ./codex/ci/check-discovery.ps1
          ./codex/ci/check-index.ps1
          ./codex/ci/check-publish.ps1
      - id: discover
        name: Discover official stable releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RETRY_FAILED: ${{ inputs.retry_failed }}
        run: ./codex/ci/discover.ps1 -Version $env:REQUESTED_VERSION -RetryFailed:($env:RETRY_FAILED -eq 'true')
  release:
    needs: discover
    if: needs.discover.outputs.has_work == 'True'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/codex-auto-build.yml
    permissions:
      contents: write
    with:
      version: ${{ matrix.version }}
      revision: ${{ matrix.revision }}
      commit: ${{ matrix.commit }}
      patch_sha: ${{ matrix.patch_sha }}
      publish: ${{ github.event_name == 'schedule' || inputs.publish == true }}
  refresh-index:
    needs: [discover, release]
    if: always() && !cancelled() && needs.discover.result == 'success' && (github.event_name == 'schedule' || inputs.publish == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: codex-auto-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reconcile index after partial publication failures
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./codex/ci/refresh-index.ps1
